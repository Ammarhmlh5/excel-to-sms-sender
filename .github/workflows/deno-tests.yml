name: Deno tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run provider unit tests
        run: |
          deno test supabase/functions/_shared/providers --allow-net --allow-env --unstable