name: Set Hudhud settings

on:
  workflow_dispatch:

jobs:
  set-hudhud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Set Hudhud settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HUDHUD_API_KEY: ${{ secrets.HUDHUD_API_KEY }}
          HUDHUD_SENDER_ID: ${{ secrets.HUDHUD_SENDER_ID }}
          HUDHUD_BASE_URL: ${{ secrets.HUDHUD_BASE_URL }}
        run: npm run set:hudhud
